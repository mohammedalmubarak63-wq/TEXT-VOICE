<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceLinguist AI Agent - تحويل الصوت والنص الذكي</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 650px; margin: auto; }
        h1 { text-align: center; font-size: 22px; color: #38bdf8; margin-bottom: 20px; }
        
        .section { background: #1e293b; padding: 20px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #334155; }
        .section h2 { font-size: 18px; margin-top: 0; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .group { flex: 1; min-width: 140px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        
        select, textarea, input[type="file"], input[type="range"] { width: 100%; background: #0f172a; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 100px; }
        
        .btn-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        button { flex: 1; min-width: 120px; background: #2563eb; color: white; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.recording { background: #dc2626; animation: pulse 1.5s infinite; }
        button.paused { background: #d97706; }
        button.secondary { background: #059669; }
        button.export-btn { background: #7c3aed; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .status { font-size: 12px; color: #38bdf8; margin-top: 6px; text-align: center; }
        audio { width: 100%; margin-top: 10px; }
        .sample-badge { background: #15803d; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VoiceLinguist AI Agent</h1>

        <!-- ================= القسم الأول: تحويل الصوت المباشر إلى نص (مستمر مع تحكم) ================= -->
        <div class="section">
            <h2>1️⃣ تحويل الكلام المباشر إلى نص</h2>
            <div class="controls">
                <div class="group">
                    <label>لغة التحدث:</label>
                    <select id="sttLang">
                        <option value="ar-SA">العربية (Saudi Arabia)</option>
                        <option value="en-US">English (US)</option>
                        <option value="ur-PK">اردو (Urdu)</option>
                        <option value="hi-IN">हिन्दी (Hindi)</option>
                    </select>
                </div>
            </div>

            <div class="btn-grid">
                <button id="startBtn" onclick="startSTT()">🎤 بدء التسجيل</button>
                <button id="pauseBtn" onclick="togglePauseSTT()" disabled>⏸️ توقف مؤقت</button>
                <button id="stopBtn" onclick="stopSTT()" disabled style="background: #475569;">⏹️ إنهاء التسجيل</button>
            </div>
            
            <div class="status" id="sttStatus">جاهز للتسجيل المستمر...</div>
            
            <label style="margin-top: 10px; display:block;">النص المكتوب المفرّغ:</label>
            <textarea id="sttOutput" placeholder="النص المكتوب سيظهر هنا أوتوماتيكياً..."></textarea>
            
            <div class="btn-grid" style="margin-top: 10px;">
                <button class="export-btn" onclick="exportToWord()">📄 تصدير النص إلى ملف Word (.docx)</button>
            </div>
        </div>

        <!-- ================= القسم الثاني: تحويل النص إلى صوت باستخدام عينة صوتية داخل التطبيق ================= -->
        <div class="section">
            <h2>2️⃣ تحويل النص إلى صوت (وفق العينة الصوتية المرفقة)</h2>
            
            <div class="group" style="margin-bottom: 12px;">
                <label>📌 الخطوة الإلزامية: ارفع المقطع الصوتي المرجعي:</label>
                <input type="file" id="voiceSampleInput" accept="audio/*" onchange="handleVoiceSample(event)">
                <div id="sampleStatus" style="display:none;" class="sample-badge">✓ تم اعتماد المقطع الصوتي المرفق</div>
                <audio id="audioPlayer" controls style="display:none; margin-top:8px;"></audio>
            </div>

            <div class="controls">
                <div class="group">
                    <label>تحكم بطبقة الصوت (Pitch لتقريب النبرة):</label>
                    <input type="range" id="pitchRange" min="0.5" max="1.5" step="0.1" value="1">
                </div>
                <div class="group">
                    <label>سرعة القراءة:</label>
                    <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="1">
                </div>
            </div>

            <div class="btn-grid">
                <button class="secondary" onclick="generateVoiceFromSample()">🔊 توليد وقراءة النص صوتياً</button>
                <button onclick="stopSpeaking()" style="background: #ef4444;">⏹️ إيقاف الصوت</button>
            </div>
            <div class="status" id="ttsStatus">الرجاء رفع مقطع صوتي أولاً ثم الضغط على توليد وقراءة النص.</div>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        // --- إدارة تحويل الصوت إلى نص (مستمر مع توقف مؤقت واستئناف وإنهاء) ---
        let recognition;
        let isRecording = false;
        let isPaused = false;
        let finalTranscript = '';

        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sttOutput = document.getElementById('sttOutput');
        const sttStatus = document.getElementById('sttStatus');
        const sttLang = document.getElementById('sttLang');

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                isPaused = false;
                startBtn.classList.add('recording');
                startBtn.innerText = '🔴 جاري التسجيل المستمر...';
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
                stopBtn.style.background = '#dc2626';
                sttStatus.innerText = 'التسجيل يعمل... يمكنك التوقف مؤقتاً أو إنهاؤه متى شئت.';
            };

            recognition.onresult = (e) => {
                let interimTranscript = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const transcript = e.results[i][0].transcript;
                    if (e.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                sttOutput.value = finalTranscript + interimTranscript;
            };

            recognition.onerror = (e) => {
                sttStatus.innerText = 'خطأ في الالتقاط: ' + e.error;
            };

            recognition.onend = () => {
                if (isRecording && !isPaused) {
                    try { recognition.start(); } catch(err){}
                }
            };
        }

        function startSTT() {
            if (!SpeechRecognition) { alert('المتصفح لا يدعم التعرف على الصوت'); return; }
            recognition.lang = sttLang.value;
            try { recognition.start(); } catch(err){}
        }

        function togglePauseSTT() {
            if (!isRecording) return;
            if (!isPaused) {
                isPaused = true;
                recognition.stop();
                startBtn.classList.remove('recording');
                pauseBtn.classList.add('paused');
                pauseBtn.innerText = '▶️ استئناف التسجيل';
                sttStatus.innerText = 'تم إيقاف التسجيل مؤقتاً. اضغط استئناف للمتابعة.';
            } else {
                isPaused = false;
                recognition.start();
                startBtn.classList.add('recording');
                pauseBtn.classList.remove('paused');
                pauseBtn.innerText = '⏸️ توقف مؤقت';
                sttStatus.innerText = 'تم استئناف التسجيل المستمر...';
            }
        }

        function stopSTT() {
            isRecording = false;
            isPaused = false;
            if (recognition) recognition.stop();
            startBtn.classList.remove('recording');
            startBtn.innerText = '🎤 بدء التسجيل';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            stopBtn.style.background = '#475569';
            sttStatus.innerText = 'تم إنهاء التسجيل وتثبيت النص بنجاح.';
        }

        function exportToWord() {
            const text = sttOutput.value;
            if (!text.trim()) { alert('لا يوجد نص مفرّغ لتصديره!'); return; }
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + `<div dir="rtl" style="font-family:Arial; font-size:14pt;">${text.replace(/\n/g, '<br>')}</div>` + footer;
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'النص_المفرغ.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }

        // --- إدارة تحويل النص إلى صوت باستخدام العينة المرفوعة ---
        let voiceSampleFile = null;

        function handleVoiceSample(event) {
            const file = event.target.files[0];
            const audioPlayer = document.getElementById('audioPlayer');
            if (file) {
                voiceSampleFile = file;
                audioPlayer.src = URL.createObjectURL(file);
                audioPlayer.style.display = 'block';
                document.getElementById('sampleStatus').style.display = 'inline-block';
                document.getElementById('ttsStatus').innerText = 'تم رفع العينة بنجاح! يمكنك سماعها عبر المشغل أعلاه، ثم توليد الصوت.';
            }
        }

        function generateVoiceFromSample() {
            const text = sttOutput.value.trim();
            const voiceInput = document.getElementById('voiceSampleInput');

            if (!text) {
                alert('الرجاء التأكد من وجود نص مفرّغ في مربع النص أولاً!');
                return;
            }

            // الشرط الإلزامي لرفع المقطع الصوتي
            if (!voiceSampleFile) {
                alert('عذراً، يجب عليك رفع مقطع صوتي مرجعي أولاً قبل تحويل النص إلى صوت!');
                voiceInput.focus();
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert('متصفحك لا يدعم توليد الصوت.');
                return;
            }

            document.getElementById('ttsStatus').innerText = 'جاري قراءة النص مطبقاً عليه إعدادات النبرة والسرعة المحددة...';

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = sttLang.value;
            
            // تطبيق خيارات التحكم بالطبقة والسرعة لمحاكاة وتعديل الصوت بناءً على تفضيلك
            utterance.pitch = parseFloat(document.getElementById('pitchRange').value);
            utterance.rate = parseFloat(document.getElementById('rateRange.value') || document.getElementById('rateRange').value);

            window.speechSynthesis.speak(utterance);
            
            utterance.onend = () => {
                document.getElementById('ttsStatus').innerText = 'تم الانتهاء من قراءة النص بنجاح.';
            };
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                document.getElementById('ttsStatus').innerText = 'تم إيقاف الصوت.';
            }
        }
    </script>
</body>
</html>
